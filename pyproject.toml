[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-no-backward"
version = "0.1.0"
description = "Forward-only LLM reinforcement learning experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "anpaure"}]
dependencies = [
  "datasets>=3,<5",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "torch>=2.5",
  "transformers>=4.48,<6",
  "wandb>=0.19,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
rl-no-backward = "rl_no_backward.cli:main"

[project.entry-points."vllm.general_plugins"]
rl_no_backward_residual_qwen = "rl_no_backward.vllm_plugin:register_residual_qwen_model"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
